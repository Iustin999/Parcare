<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcare Generată</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url('fundalul.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90vw;
            height: 90vh;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        @media (min-width: 768px) {
            canvas {
                transform: rotate(-90deg);
            }
        }

        /* Stil pentru notificare */
        .notification {
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: top 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="notification" id="notification">Locuri libere: 5</div>
    <div class="canvas-container">
        <canvas id="parkingCanvas"></canvas>
    </div>

    <script>
        const carImages = [
            "m1.png", "m2.png", "m3.png", "m4.png", "m5.png"
        ];
        const parkingImageSrc = "ParcareM1.JPG";
        
        // Poziții exacte ale mașinilor raportate la parcarea de referință (1170x2080)
        const carPositions = [
            { x: 220, y: 1410, width: 590, height: 600, rotate: -133 },
            { x: 220, y: 1080, width: 600, height: 600, rotate: -133 },
            { x: 220, y: 770, width: 580, height: 585, rotate: -133 },
            { x: 220, y: 450, width: 550, height: 590, rotate: -133 },
            { x: 220, y: 130, width: 550, height: 590, rotate: -133 }
        ];

        function showNotification(freeSpots) {
            let notification = document.getElementById("notification");
            notification.innerText = `Locuri libere: ${freeSpots}`;
            notification.style.top = "20px";

            setTimeout(() => {
                notification.style.top = "-50px";
            }, 3000);
        }

        function drawParking(codBinar) {
            const canvas = document.getElementById("parkingCanvas");
            const ctx = canvas.getContext("2d");

            const parkingImg = new Image();
            parkingImg.src = parkingImageSrc;
            parkingImg.onload = () => {
                let isDesktop = window.innerWidth > 768;
                canvas.width = isDesktop ? parkingImg.height : parkingImg.width;
                canvas.height = isDesktop ? parkingImg.width : parkingImg.height;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (isDesktop) {
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(-Math.PI / 2);
                    ctx.drawImage(parkingImg, -parkingImg.width / 2, -parkingImg.height / 2, parkingImg.width, parkingImg.height);
                    ctx.restore();
                } else {
                    ctx.drawImage(parkingImg, 0, 0, canvas.width, canvas.height);
                }

                let freeSpots = 5;

                for (let i = 0; i < carPositions.length; i++) {
                    if (codBinar[i] === "1") {
                        freeSpots--;
                        const carImg = new Image();
                        carImg.src = carImages[i];
                        carImg.onload = () => {
                            ctx.save();
                            if (isDesktop) {
                                let rotatedX = canvas.height - carPositions[i].y;
                                let rotatedY = carPositions[i].x;
                                ctx.translate(rotatedX + carPositions[i].width / 2, rotatedY + carPositions[i].height / 2);
                                ctx.rotate((-133 * Math.PI) / 180);
                            } else {
                                ctx.translate(carPositions[i].x + carPositions[i].width / 2, carPositions[i].y + carPositions[i].height / 2);
                                ctx.rotate((carPositions[i].rotate * Math.PI) / 180);
                            }
                            ctx.drawImage(carImg, -carPositions[i].width / 2, -carPositions[i].height / 2, carPositions[i].width, carPositions[i].height);
                            ctx.restore();
                        };
                    }
                }

                showNotification(freeSpots);
            };
        }

        async function fetchParkingData() {
            let sheetID = "1VesxOsLpI112PZk0ZQ6noxfMe79oDfDNuVwkTzm_Idw"; // Pune ID-ul corect
            let url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

            try {
                let response = await fetch(url);
                let text = await response.text();
                let json = JSON.parse(text.substring(47, text.length - 2));

                let cellValue = json.table.rows[0].c[0];
                if (!cellValue || !cellValue.v) {
                    return;
                }

                let codBinar = String(cellValue.v).trim();
                if (codBinar.length !== 5) {
                    return;
                }

                drawParking(codBinar);
            } catch (error) {
                console.error("❌ Eroare la preluarea datelor:", error);
            }
        }

        fetchParkingData();
        setInterval(fetchParkingData, 5000);
    </script>
</body>
</html>
