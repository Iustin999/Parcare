<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcare Live - Setare Coordonate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2c2c2c; /* Fundal neutru */
            overflow: hidden;
        }
        .parking-container {
            position: relative;
            width: 1170px;
            height: 2080px;
        }
        .parking-container img {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="parking-container">
        <img id="parkingImage" src="ParcareM1.JPG" alt="Parcare">
    </div>

    <script>
        function addCar(id, x, y, width, rotate) {
            let car = document.createElement("img");
            car.src = `m${id}.png`; // Imaginea mașinii
            car.style.position = "absolute";
            car.style.width = `${width}px`;
            car.style.top = `${y}px`;
            car.style.left = `${x}px`;
            car.style.transform = `rotate(${rotate}deg)`;
            car.style.zIndex = "10";
            document.querySelector(".parking-container").appendChild(car);
            console.log(`✅ Adăugată: M${id} la X=${x}, Y=${y}, Width=${width}, Rotate=${rotate}°`);
        }
    </script>
</body>
</html>
