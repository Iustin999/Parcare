<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcare Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url('fundalul.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .parking-container {
            position: relative;
            width: 90vw; /* Parcarea ocupă 90% din lățimea ecranului */
            max-width: 1170px; /* Să nu depășească dimensiunea originală */
            aspect-ratio: 1170 / 2080; /* Păstrează proporțiile originale */
        }
        .parking-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .car {
            position: absolute;
            width: 10%; /* Ajustăm dinamic */
            transform-origin: center;
            display: none; /* Implicit, ascunse până când codul binar spune altfel */
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="parking-container">
        <img id="parkingImage" src="ParcareM1.JPG" alt="Parcare">
        <img id="m1" class="car" src="m1.png">
        <img id="m2" class="car" src="m2.png">
        <img id="m3" class="car" src="m3.png">
        <img id="m4" class="car" src="m4.png">
        <img id="m5" class="car" src="m5.png">
    </div>

    <script>
        // Poziții relative la dimensiunea imaginii parcării
        const carPositions = [
            { x: 0.188, y: 0.678, width: 0.50, height: 0.28, rotate: -133 },
            { x: 0.188, y: 0.519, width: 0.51, height: 0.28, rotate: -133 },
            { x: 0.188, y: 0.370, width: 0.49, height: 0.28, rotate: -133 },
            { x: 0.188, y: 0.216, width: 0.47, height: 0.28, rotate: -133 },
            { x: 0.188, y: 0.062, width: 0.47, height: 0.28, rotate: -133 }
        ];

        function updateCarPositions() {
            let parkingRect = document.getElementById("parkingImage").getBoundingClientRect();

            for (let i = 0; i < 5; i++) {
                let car = document.getElementById(`m${i+1}`);
                if (car) {
                    car.style.left = `${parkingRect.left + parkingRect.width * carPositions[i].x}px`;
                    car.style.top = `${parkingRect.top + parkingRect.height * carPositions[i].y}px`;
                    car.style.width = `${parkingRect.width * carPositions[i].width}px`;
                    car.style.height = `${parkingRect.height * carPositions[i].height}px`;
                    car.style.transform = `rotate(${carPositions[i].rotate}deg)`;
                }
            }
        }

        async function fetchParkingData() {
            let sheetID = "1VesxOsLpI112PZk0ZQ6noxfMe79oDfDNuVwkTzm_Idw"; // Pune ID-ul corect
            let url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

            try {
                let response = await fetch(url);
                let text = await response.text();
                let json = JSON.parse(text.substring(47, text.length - 2));

                let cellValue = json.table.rows[0].c[0];
                if (!cellValue || !cellValue.v) {
                    console.error("⚠️ Eroare: Celula din Google Sheets nu conține date!");
                    return;
                }

                let codBinar = String(cellValue.v).trim();
                console.log("✅ Cod Binar extras:", codBinar);

                if (codBinar.length !== 5) {
                    console.error("⚠️ Eroare: Codul binar nu are exact 5 caractere!");
                    return;
                }

                for (let i = 0; i < 5; i++) {
                    let car = document.getElementById(`m${i+1}`);
                    if (car) {
                        car.style.display = codBinar[i] === "1" ? "block" : "none";
                        console.log(`✅ Loc ${i+1}: ${codBinar[i] === "1" ? "Ocupat" : "Liber"}`);
                    }
                }
            } catch (error) {
                console.error("❌ Eroare la preluarea datelor:", error);
            }
        }

        window.addEventListener("resize", updateCarPositions);
        updateCarPositions();
        setInterval(fetchParkingData, 5000);
        fetchParkingData();
    </script>
</body>
</html>
