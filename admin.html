<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Admin Parcare</title>
  <style>
    body {
      background: url('bgnd_admin.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
      flex-direction: column;
    }
    #loginSection, #adminPanel {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    input[type="password"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 200px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .toggle-mode {
      background-color: #2e7d32;
      color: white;
    }
    .manual-mode {
      background-color: #c62828;
    }
    .disabled {
      background-color: grey;
      cursor: not-allowed;
      color: #ccc;
    }
    .active-button {
      border: 2px solid #00ff00 !important;
    }
    #adminPanel {
      display: none;
    }
    .button-group {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .button-group button {
      background-color: #2196f3;
      color: white;
    }
    #eroriContainer {
      margin-top: 30px;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
      width: 100%;
    }
    #eroriContainer ul {
      list-style: none;
      padding-left: 0;
    }
    #eroriContainer li {
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="loginSection">
    <h2>🔒 Acces Admin</h2>
    <input type="password" id="passwordInput" placeholder="Parola admin">
    <br><br>
    <button onclick="checkPassword()">Intră</button>
  </div>

  <div id="adminPanel">
    <h2>🔧 Panou Control Parcare</h2>
    <button id="modeButton" class="toggle-mode" onclick="toggleMode()">Automat</button>

    <div id="controlButtons" class="button-group">
      <h3 style="width: 100%; color: lightgray;">Control Manual Bariere</h3>
      <button id="btn1up" class="disabled" onclick="sendCommand('intrare', 'ridica')">Ridică Bariera Intrare</button>
      <button id="btn1down" class="disabled" onclick="sendCommand('intrare', 'coboara')">Coboară Bariera Intrare</button>
      <button id="btn2up" class="disabled" onclick="sendCommand('iesire', 'ridica')">Ridică Bariera Ieșire</button>
      <button id="btn2down" class="disabled" onclick="sendCommand('iesire', 'coboara')">Coboară Bariera Ieșire</button>
    </div>

    <div id="eroriContainer">
      <h3>📢 Mesaje raportate</h3>
      <ul id="listaErori"><li>Se încarcă...</li></ul>
      <button onclick="stergeErori()">🗑️ Șterge toate mesajele</button>
    </div>
  </div>

  <script>
    const firebaseURL = "https://smartparkingupg-default-rtdb.europe-west1.firebasedatabase.app";
    const secret = "gRJBmokssBeRi035x2Xvd7gAPwzoa8s7jQ6PVHBa";
    let isManual = false;
    let intervalErori = null;

    function checkPassword() {
      const parola = document.getElementById("passwordInput").value;
      if (parola === "automatica") {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        if (document.visibilityState === "visible") startErrorReading();
      } else {
        alert("Parolă greșită!");
      }
    }

    function toggleMode() {
      isManual = !isManual;
      const modeBtn = document.getElementById("modeButton");
      const buttons = document.querySelectorAll("#controlButtons button");
      const newMode = isManual ? "manual" : "automat";

      fetch(`${firebaseURL}/mod.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify(newMode)
      });

      if (isManual) {
        modeBtn.textContent = "Manual";
        modeBtn.classList.remove("toggle-mode");
        modeBtn.classList.add("manual-mode");
        buttons.forEach(btn => btn.classList.remove("disabled"));
      } else {
        modeBtn.textContent = "Automat";
        modeBtn.classList.remove("manual-mode");
        modeBtn.classList.add("toggle-mode");
        buttons.forEach(btn => {
          btn.classList.remove("active-button");
          btn.classList.add("disabled");
        });
        resetFirebaseCommands();
      }
    }

    function sendCommand(bariera, actiune) {
      if (!isManual) return;

      fetch(`${firebaseURL}/comenzi/${bariera}.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify(actiune)
      });

      const buttonMap = {
        intrare: ['btn1up', 'btn1down'],
        iesire: ['btn2up', 'btn2down']
      };

      buttonMap[bariera].forEach(id => {
        document.getElementById(id).classList.remove("active-button");
      });

      const targetBtn = actiune === 'ridica'
        ? document.getElementById(bariera === 'intrare' ? 'btn1up' : 'btn2up')
        : document.getElementById(bariera === 'intrare' ? 'btn1down' : 'btn2down');

      targetBtn.classList.add("active-button");
    }

    function resetFirebaseCommands() {
      fetch(`${firebaseURL}/comenzi.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify({ intrare: "nimic", iesire: "nimic" })
      });
    }

    function incarcaErori() {
      fetch(`${firebaseURL}/erori.json?auth=${secret}`)
        .then(res => res.json())
        .then(data => {
          const lista = document.getElementById("listaErori");
          lista.innerHTML = "";
          if (!data) {
            lista.innerHTML = "<li>Nicio eroare raportată</li>";
            return;
          }

          Object.values(data).forEach(entry => {
  const li = document.createElement("li");
  const timp = entry.timestamp
    ? new Date(entry.timestamp).toLocaleString()
    : "(fără dată)";
  li.innerHTML = `<strong>${timp}:</strong> ${entry.mesaj || entry}`;
  lista.appendChild(li);
});
        });
    }

    function stergeErori() {
      fetch(`${firebaseURL}/erori.json?auth=${secret}`, { method: "DELETE" })
        .then(() => incarcaErori());
    }

    function startErrorReading() {
      if (!intervalErori) {
        incarcaErori();
        intervalErori = setInterval(incarcaErori, 3000);
      }
    }

    function stopErrorReading() {
      if (intervalErori) {
        clearInterval(intervalErori);
        intervalErori = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && document.getElementById("adminPanel").style.display === "block") {
        startErrorReading();
      } else {
        stopErrorReading();
      }
    });
  </script>
</body>
</html>
