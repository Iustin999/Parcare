<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Admin Parcare</title>
  <style>
    body {
      background: url('bgnd_admin.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: white;
      flex-direction: column;
    }

    #loginSection, #adminPanel {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    input[type="password"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 200px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-mode {
      background-color: #2e7d32;
      color: white;
    }

    .manual-mode {
      background-color: #c62828;
    }

    .disabled {
      background-color: grey;
      cursor: not-allowed;
      color: #ccc;
    }

    .active-button {
      border: 2px solid #00ff00;
    }

    #adminPanel {
      display: none;
    }

    .button-group {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button-group button {
      background-color: #2196f3;
      color: white;
    }
  </style>
</head>
<body>
  <div id="loginSection">
    <h2>🔒 Acces Admin</h2>
    <input type="password" id="passwordInput" placeholder="Parola admin">
    <br><br>
    <button onclick="checkPassword()">Intră</button>
  </div>

  <div id="adminPanel">
    <h2>🔧 Panou Control Parcare</h2>
    <button id="modeButton" class="toggle-mode" onclick="toggleMode()">Automat</button>

    <div id="controlButtons" class="button-group">
      <h3 style="width: 100%; color: lightgray;">Control Manual Bariere</h3>
      <button id="btn1up" class="disabled" onclick="sendCommand('intrare', 'ridica')">Ridică Bariera Intrare</button>
      <button id="btn1down" class="disabled" onclick="sendCommand('intrare', 'coboara')">Coboară Bariera Intrare</button>
      <button id="btn2up" class="disabled" onclick="sendCommand('iesire', 'ridica')">Ridică Bariera Ieșire</button>
      <button id="btn2down" class="disabled" onclick="sendCommand('iesire', 'coboara')">Coboară Bariera Ieșire</button>
    </div>
  </div>

  <script>
    const firebaseURL = "https://smartparkingupg-default-rtdb.europe-west1.firebasedatabase.app";
    const secret = "SECRETTOKEN"; // <-- înlocuiește cu secretul tău real Firebase
    let isManual = false;
    let currentCommands = {
      intrare: "nimic",
      iesire: "nimic"
    };

    function checkPassword() {
      const parola = document.getElementById("passwordInput").value;
      if (parola === "automatica") {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
      } else {
        alert("Parolă greșită!");
      }
    }

    function toggleMode() {
      isManual = !isManual;
      const modeBtn = document.getElementById("modeButton");
      const buttons = document.querySelectorAll("#controlButtons button");

      const newMode = isManual ? "manual" : "automat";
      fetch(`${firebaseURL}/mod.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify(newMode)
      });

      if (isManual) {
        modeBtn.textContent = "Manual";
        modeBtn.classList.remove("toggle-mode");
        modeBtn.classList.add("manual-mode");
        buttons.forEach(btn => btn.classList.remove("disabled"));
      } else {
        modeBtn.textContent = "Automat";
        modeBtn.classList.remove("manual-mode");
        modeBtn.classList.add("toggle-mode");
        buttons.forEach(btn => {
          btn.classList.remove("active-button");
          btn.classList.add("disabled");
        });
        resetFirebaseCommands();
      }
    }

    function sendCommand(bariera, actiune) {
      if (!isManual) return;

      currentCommands[bariera] = actiune;

      // Trimite doar comanda pentru bariera respectivă
      fetch(`${firebaseURL}/comenzi/${bariera}.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify(actiune)
      });

      const buttonMap = {
        intrare: ['btn1up', 'btn1down'],
        iesire: ['btn2up', 'btn2down']
      };

      buttonMap[bariera].forEach(id => {
        document.getElementById(id).classList.remove("active-button");
      });

      const targetBtn = actiune === 'ridica'
        ? document.getElementById(bariera === 'intrare' ? 'btn1up' : 'btn2up')
        : document.getElementById(bariera === 'intrare' ? 'btn1down' : 'btn2down');

      targetBtn.classList.add("active-button");
    }

    function resetFirebaseCommands() {
      fetch(`${firebaseURL}/comenzi.json?auth=${secret}`, {
        method: "PUT",
        body: JSON.stringify({ intrare: "nimic", iesire: "nimic" })
      });
    }
  </script>
</body>
</html>
